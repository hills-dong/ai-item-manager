name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Download existing Pages artifact
        id: download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Try to find the latest successful deployment artifact
            try {
              const deployments = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 1
              });
              core.info(`Found ${deployments.data.length} deployments`);
            } catch (e) {
              core.info('No existing deployments found');
            }
            return 'done';

      - name: Prepare deployment directory
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Create deploy directory with branch subdirectory
          mkdir -p "deploy/${SAFE_BRANCH}"

          # Copy site files into branch subdirectory
          for f in $(ls -A | grep -v -E '^(\.git|deploy)$'); do
            cp -r "$f" "deploy/${SAFE_BRANCH}/"
          done

          # If this is the main branch, also copy files to root so that
          # the root URL serves main branch content directly
          if [ "$BRANCH_NAME" = "main" ]; then
            for f in $(ls -A | grep -v -E '^(\.git|deploy)$'); do
              cp -r "$f" "deploy/"
            done
            echo "Main branch files also copied to deploy root"
          fi

          echo "Deployed branch: ${BRANCH_NAME} -> ${SAFE_BRANCH}"
          ls -la "${SAFE_BRANCH}/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
