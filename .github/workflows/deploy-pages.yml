name: Deploy to GitHub Pages

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Prepare and deploy to gh-pages
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Clone or init gh-pages branch
          git clone --branch gh-pages --single-branch "$REPO_URL" gh-pages-dir 2>/dev/null || {
            mkdir -p gh-pages-dir
            cd gh-pages-dir
            git init -b gh-pages
            git remote add origin "$REPO_URL"
            cd ..
          }

          # Clean old content for this branch
          rm -rf "gh-pages-dir/${SAFE_BRANCH}"
          mkdir -p "gh-pages-dir/${SAFE_BRANCH}"

          # Copy site files (exclude .git and gh-pages-dir and .github)
          for f in $(ls -A | grep -v -E '^(\.git|gh-pages-dir)$'); do
            cp -r "$f" "gh-pages-dir/${SAFE_BRANCH}/"
          done

          # Generate index page listing all deployed branches
          cd gh-pages-dir
          cat > index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Branch Previews</title>
          <style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:0 20px}a{display:block;padding:8px 0;font-size:18px}</style>
          </head><body><h1>Branch Previews</h1>
          INDEXEOF
          for dir in */; do
            dir_name="${dir%/}"
            if [ "$dir_name" != "*" ]; then
              echo "<a href=\"${dir_name}/\">${dir_name}</a>" >> index.html
            fi
          done
          echo '</body></html>' >> index.html

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy branch ${BRANCH_NAME} to GitHub Pages"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
