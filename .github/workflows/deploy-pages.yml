name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deploy
        continue-on-error: true

      - name: Initialize deploy directory if gh-pages doesn't exist
        run: |
          if [ ! -d "deploy/.git" ]; then
            mkdir -p deploy
          fi

      - name: Update branch content
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Remove old content for this branch
          rm -rf "deploy/${SAFE_BRANCH}"
          mkdir -p "deploy/${SAFE_BRANCH}"

          # Copy site files into branch subdirectory
          for f in $(ls -A source | grep -v -E '^\.git$'); do
            cp -r "source/$f" "deploy/${SAFE_BRANCH}/"
          done

          # If this is the main branch, also copy files to root
          if [ "$BRANCH_NAME" = "main" ]; then
            for f in $(ls -A source | grep -v -E '^\.git$'); do
              cp -r "source/$f" "deploy/"
            done
            echo "Main branch files also copied to deploy root"
          fi

          echo "Deployed branch: ${BRANCH_NAME} -> ${SAFE_BRANCH}"
          ls -la "deploy/${SAFE_BRANCH}/"

      - name: Commit to gh-pages branch
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Deploy ${GITHUB_REF_NAME}"
          git push origin gh-pages || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
