name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Download existing Pages artifact
        id: download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Try to find the latest successful deployment artifact
            try {
              const deployments = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 1
              });
              core.info(`Found ${deployments.data.length} deployments`);
            } catch (e) {
              core.info('No existing deployments found');
            }
            return 'done';

      - name: Prepare deployment directory
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')

          # Create deploy directory with branch subdirectory
          mkdir -p "deploy/${SAFE_BRANCH}"

          # Copy site files into branch subdirectory
          for f in $(ls -A | grep -v -E '^(\.git|deploy)$'); do
            cp -r "$f" "deploy/${SAFE_BRANCH}/"
          done

          # Generate index page listing all branches
          cd deploy
          cat > index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>Branch Previews - ai-item-manager</title>
          <style>body{font-family:system-ui;max-width:600px;margin:40px auto;padding:0 20px}a{display:block;padding:8px 0;font-size:18px}</style>
          </head><body><h1>Branch Previews</h1>
          INDEXEOF
          for dir in */; do
            dir_name="${dir%/}"
            if [ "$dir_name" != "*" ]; then
              echo "<a href=\"${dir_name}/\">${dir_name}</a>" >> index.html
            fi
          done
          echo '</body></html>' >> index.html

          echo "Deployed branch: ${BRANCH_NAME} -> ${SAFE_BRANCH}"
          ls -la "${SAFE_BRANCH}/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
